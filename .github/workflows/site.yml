name: site
on:
  push:
    paths: ["site/**", "data/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "data/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 site/build.py --check
      - run: node --check site/player.js
