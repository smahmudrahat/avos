# SPIRE Server, one per host (POC 3). Signs SVIDs for every microVM on this host.
# Guests reach it on their tap gateway (172.16.N.1:8081); only identity/registrar.py writes entries.
server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  socket_path = "/run/spire-server/api.sock"
  trust_domain = "avoslab.com"
  data_dir = "/var/lib/avos/spire"
  log_level = "WARN"
  ca_ttl = "24h"
  default_x509_svid_ttl = "1h"
  audit_log_enabled = true
  # New entries reach agents only after this reload (default 5 s); this is most of M4. The guest agent syncs every 1 s.
  experimental { cache_reload_interval = "500ms" }
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/var/lib/avos/spire/datastore.sqlite3"
    }
  }
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/var/lib/avos/spire/keys.json"
    }
  }
}
